<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0B0F19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1E1035"/></linearGradient><linearGradient id="text-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366F1" stop-opacity=".8"/><stop offset="100%" stop-color="#A855F7" stop-opacity=".3"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#000" flood-opacity=".6" stdDeviation="8"/></filter><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseNode{0%{r:6px;opacity:.4}50%{r:10px;opacity:.9}}@keyframes floatWave{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes dashMove{0%{stroke-dashoffset:100}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#text-grad)}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.node-1{animation:pulseNode 3s infinite ease-in-out}.node-2{animation:pulseNode 4s infinite ease-in-out 1s}.node-3{animation:pulseNode 3.5s infinite ease-in-out .5s}.floating-card-1{animation:floatWave 6s infinite ease-in-out}.floating-card-2{animation:floatWave 7s infinite ease-in-out 1.5s}.connecting-line{stroke:#6366f1;stroke-width:1.5;stroke-dasharray:6 6;opacity:.35;animation:dashMove 20s linear infinite}</style><rect width="1200" height="360" fill="url(#bg-grad)" rx="16"/><g class="background-elements"><line x1="100" x2="250" y1="80" y2="160" class="connecting-line"/><line x1="250" x2="180" y1="160" y2="280" class="connecting-line"/><line x1="1000" x2="920" y1="90" y2="200" class="connecting-line"/><line x1="920" x2="1080" y1="200" y2="290" class="connecting-line"/><line x1="920" x2="780" y1="200" y2="270" class="connecting-line"/><circle cx="100" cy="80" r="6" fill="#38BDF8" class="node-1" filter="url(#glow)"/><circle cx="250" cy="160" r="8" fill="#818CF8" class="node-2" filter="url(#glow)"/><circle cx="180" cy="280" r="7" fill="#C084FC" class="node-3" filter="url(#glow)"/><circle cx="1000" cy="90" r="8" fill="#38BDF8" class="node-2" filter="url(#glow)"/><circle cx="920" cy="200" r="6" fill="#A855F7" class="node-1" filter="url(#glow)"/><circle cx="1080" cy="290" r="7" fill="#818CF8" class="node-3" filter="url(#glow)"/><circle cx="200" cy="120" r="140" fill="#6366F1" filter="url(#glow)" opacity=".12"/><circle cx="1000" cy="240" r="160" fill="#A855F7" filter="url(#glow)" opacity=".15"/><g class="floating-card-1" opacity=".25"><rect width="140" height="45" x="80" y="190" fill="#1E293B" stroke="#475569" stroke-width="1" rx="10"/><text x="100" y="218" fill="#38BDF8" font-family="sans-serif" font-size="12">🤖 Agentic AI</text></g><g class="floating-card-2" opacity=".25"><rect width="140" height="45" x="980" y="120" fill="#1E293B" stroke="#475569" stroke-width="1" rx="10"/><text x="1000" y="148" fill="#C084FC" font-family="sans-serif" font-size="12">💬 LLM Dialog</text></g></g><g class="foreground-content" filter="url(#shadow)" text-anchor="middle" transform="translate(600, 150)"><g transform="translate(0, -65)"><rect width="140" height="34" x="-70" y="-18" fill="url(#accent-grad)" stroke="#818CF8" stroke-width="1.5" rx="17"/><text x="0" y="5" fill="#FFF" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" text-anchor="middle">🚀 2026 EDITION</text></g><text x="0" y="5" class="title">Awesome Conversational AI &amp; Chatbot Platform</text><text x="0" y="42" class="subtitle">Curated Directory of Commercial SaaS Platforms &amp; Open-Source Dialog Frameworks</text><g><g transform="translate(0, 85) translate(-240, 0)"><rect width="140" height="32" x="-70" y="-16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" rx="16"/><text x="0" y="5" class="badge-text" text-anchor="middle">🧠 LLM Agents</text></g><g transform="translate(0, 85) translate(-80, 0)"><rect width="140" height="32" x="-70" y="-16" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" rx="16"/><text x="0" y="5" class="badge-text" text-anchor="middle">🔓 Open Source</text></g><g transform="translate(0, 85) translate(80, 0)"><rect width="140" height="32" x="-70" y="-16" fill="#1E293B" stroke="#C084FC" stroke-width="1.2" rx="16"/><text x="0" y="5" class="badge-text" text-anchor="middle">🏢 Enterprise CX</text></g><g transform="translate(0, 85) translate(240, 0)"><rect width="140" height="32" x="-70" y="-16" fill="#1E293B" stroke="#F472B6" stroke-width="1.2" rx="16"/><text x="0" y="5" class="badge-text" text-anchor="middle">🎨 Visual Flow</text></g></g></g></svg>